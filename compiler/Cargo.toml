[package]
name = "sbdsl"
version = "0.4.0"
edition = "2024"
description = "Standalone Rust compiler for ScratchDSL"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
md5 = "0.7"
base64 = "0.22"
rquickjs = "0.14"
roxmltree = "0.20"
png = "0.17"
unicode-general-category = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"

[dev-dependencies]
tempfile = "3"
