name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check
      - name: Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings
      - name: Test compiler and language server
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --locked
      - name: Build example projects
        run: |
          cargo +"$RUST_TOOLCHAIN" run --locked -- build examples/hello/sbdsl.buildsb
          cargo +"$RUST_TOOLCHAIN" run --locked -- build examples/extensions/sbdsl.buildsb

  windows-package:
    name: Windows packages and VS Code
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Check versions
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          compiler = tomllib.loads(pathlib.Path('compiler/Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          extension = json.loads(pathlib.Path('vscode/package.json').read_text(encoding='utf-8'))['version']
          if compiler != extension:
              raise SystemExit(f'Compiler {compiler} and extension {extension} versions differ')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{compiler}':
              raise SystemExit(f'Release tag must be v{compiler}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={compiler}', file=output)
          PY
      - name: Install Rust
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
      - name: Build release compiler
        run: cargo build --release --locked
      - name: Test installer PATH handling
        run: ./packaging/windows/tests/path.ps1
      - name: Package standalone installer
        run: ./packaging/package.ps1 -SkipBuild
      - name: Test and package VS Code extension
        run: ./packaging/package-vscode.ps1 -SkipBuild
      - name: Test installed VSIX in VS Code
        env:
          SCRATCHDSL_TEST_VSCODE_VERSION: 1.142.0
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node vscode/test/run-host.cjs --installed "dist/scratchdsl-$env:RELEASE_VERSION-win32-x64.vsix"
      - name: Prepare and verify release assets
        run: ./packaging/prepare-release.ps1
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scratchdsl-windows-x64
          path: |
            dist/Install.exe
            dist/sbdsl.exe
            dist/scratchdsl-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/scratchdsl-${{ steps.version.outputs.version }}-win32-x64.vsix
            dist/SHA256SUMS.txt
            dist/release-manifest.json
            dist/THIRD_PARTY_NOTICES.txt
            dist/LICENSE
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload VS Code test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-host-logs
          path: vscode/.vscode-test/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.windows-package.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scratchdsl-windows-x64
          path: dist
      - name: Verify release assets
        run: |
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          python .github/scripts/release-assets.py
      - name: Publish verified assets
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/$RELEASE_VERSION.md"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "Release $tag is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --target "$GITHUB_SHA" \
              --draft --prerelease --title "ScratchDSL $RELEASE_VERSION（过渡版）" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/Install.exe dist/sbdsl.exe \
            "dist/scratchdsl-$RELEASE_VERSION-windows-x64.zip" \
            "dist/scratchdsl-$RELEASE_VERSION-win32-x64.vsix" \
            dist/SHA256SUMS.txt dist/release-manifest.json dist/THIRD_PARTY_NOTICES.txt dist/LICENSE --clobber
          gh release view "$tag" --json assets > "$RUNNER_TEMP/uploaded-assets.json"
          python .github/scripts/release-assets.py "$RUNNER_TEMP/uploaded-assets.json"
          gh release edit "$tag" --draft=false --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "ScratchDSL $RELEASE_VERSION（过渡版）" --notes-file "$notes"
